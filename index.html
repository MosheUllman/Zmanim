<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zmanim</title>

<style>
    body {
        margin: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
        color: #111111;
    }

    .container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .title {
        font-size: 5vw;
        font-weight: bold;
        margin-bottom: 2vh;
    }

    .date {
        font-size: 2.5vw;
        margin-bottom: 4vh;
    }

    .times {
        width: 85%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2vw;
    }

    .zman {
        text-align: center;
        border: 2px solid #cccccc;
        border-radius: 15px;
        padding: 2vh 1vw;
    }

    .name {
        font-size: 2vw;
        font-weight: bold;
        margin-bottom: 1vh;
    }

    .time {
        font-size: 3.5vw;
        font-weight: bold;
    }

    .error {
        font-size: 3vw;
        color: red;
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">זמנים</div>

    <div class="date" id="date">Loading...</div>

    <div class="times" id="times">
        Loading zmanim...
    </div>

</div>

<script>

const zip = "12167";

function formatTime(dateString) {
    if (!dateString) return "--:--";

    const date = new Date(dateString);

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function formatDate(dateString) {
    const date = new Date(dateString);

    return date.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric"
    });
}

async function loadZmanim() {

    const today = new Date();

    const date =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    const url =
        `https://www.hebcal.com/zmanim?cfg=json&zip=${zip}&date=${date}`;

    try {

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("date").innerText =
            formatDate(date);

        const zmanim = data.times;

        document.getElementById("times").innerHTML = `

            <div class="zman">
                <div class="name">עלות השחר</div>
                <div class="time">${formatTime(zmanim.chatzotNight)}</div>
            </div>

            <div class="zman">
                <div class="name">משיכיר</div>
                <div class="time">${formatTime(zmanim.misheyakir)}</div>
            </div>

            <div class="zman">
                <div class="name">זריחה</div>
                <div class="time">${formatTime(zmanim.sunrise)}</div>
            </div>

            <div class="zman">
                <div class="name">סוף זמן ק"ש</div>
                <div class="time">${formatTime(zmanim.sofZmanShma)}</div>
            </div>

            <div class="zman">
                <div class="name">סוף זמן תפילה</div>
                <div class="time">${formatTime(zmanim.sofZmanTfilla)}</div>
            </div>

            <div class="zman">
                <div class="name">חצות</div>
                <div class="time">${formatTime(zmanim.chatzot)}</div>
            </div>

            <div class="zman">
                <div class="name">שקיעה</div>
                <div class="time">${formatTime(zmanim.sunset)}</div>
            </div>

            <div class="zman">
                <div class="name">צאת הכוכבים</div>
                <div class="time">${formatTime(zmanim.tzeit)}</div>
            </div>

        `;

    } catch (error) {

        document.getElementById("times").innerHTML =
            '<div class="error">Unable to load zmanim</div>';

    }
}

loadZmanim();

setInterval(loadZmanim, 60 * 60 * 1000);

</script>

</body>
</html>
