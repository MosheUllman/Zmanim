<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zmanim for TheZone</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
}

.container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 3vh 4vw;
}

.header {
    text-align: center;
    font-size: 6vw;
    font-weight: bold;
    margin-bottom: 1vh;
}

.location {
    text-align: center;
    font-size: 3vw;
    font-weight: bold;
}

.date {
    text-align: center;
    font-size: 2.5vw;
    margin: 1vh 0 4vh 0;
}

.times {
    flex: 1;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3vw;
}

.zman {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 4px solid #cccccc;
    border-radius: 25px;
}

.name {
    font-size: 3.5vw;
    font-weight: bold;
    margin-bottom: 4vh;
}

.time {
    font-size: 8vw;
    font-weight: bold;
}

.error {
    font-size: 3vw;
    text-align: center;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        Zmanim for TheZone
    </div>

    <div class="location">
        12167
    </div>

    <div class="date" id="date">
        Loading...
    </div>

    <div class="times" id="times">
        Loading zmanim...
    </div>

</div>

<script>

const zip = "12167";

function getNewYorkDate() {

    const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    let year = parts.find(p => p.type === "year").value;
    let month = parts.find(p => p.type === "month").value;
    let day = parts.find(p => p.type === "day").value;

    return `${year}-${month}-${day}`;
}

function formatTime(dateString) {

    if (!dateString) {
        return "--:--";
    }

    return new Date(dateString).toLocaleTimeString("en-US", {
        timeZone: "America/New_York",
        hour: "numeric",
        minute: "2-digit"
    });
}

function formatDate(dateString) {

    const [year, month, day] = dateString.split("-");

    const date = new Date(year, month - 1, day);

    return date.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
    });
}

async function loadZmanim() {

    const date = getNewYorkDate();

    const url =
        `https://www.hebcal.com/zmanim?cfg=json&zip=${zip}&date=${date}`;

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        document.getElementById("date").innerText =
            formatDate(date);

        document.getElementById("times").innerHTML = `

            <div class="zman">

                <div class="name">
                    Latest time to say Shema
                </div>

                <div class="time">
                    ${formatTime(data.times.sofZmanShma)}
                </div>

            </div>

            <div class="zman">

                <div class="name">
                    Latest time to daven
                </div>

                <div class="time">
                    ${formatTime(data.times.sofZmanTfilla)}
                </div>

            </div>

        `;

    } catch (error) {

        document.getElementById("times").innerHTML = `
            <div class="error">
                Unable to load zmanim
            </div>
        `;

        console.error(error);
    }
}

loadZmanim();

// Refresh every hour
setInterval(loadZmanim, 60 * 60 * 1000);

</script>

</body>
</html>
